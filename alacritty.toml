general.import = [
  # uncomment the flavour you want below:
  #"~/.config/alacritty/catppuccin-latte.toml"
  #~/.config/alacritty/catppuccin-frappe.toml"
  "~/.config/alacritty/catppuccin-macchiato.toml"
  # "~/.config/alacritty/catppuccin-mocha.toml"
]

[window]
opacity = 0.95
blur = true
option_as_alt = "Both"

[font]
normal = { family = "Mononoki Nerd Font Mono", style = "Regular" }
bold = { family = "Mononoki Nerd Font Mono", style = "Bold"}
italic = { family = "Mononoki Nerd Font Mono", style = "Italic"}
bold_italic = { family = "Mononoki Nerd Font Mono", style = "Bold Italic"}
size = 16

[keyboard]
bindings = [
  { key = "Right", mods = "Alt", chars = "\u001BF" },
  { key = "Left", mods = "Alt", chars = "\u001BB" },
  { key = "X", mods = "Alt", chars = "\u001Bx"},
]
