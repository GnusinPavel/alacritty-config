general.import = [
  # uncomment the flavour you want below:
  #"~/.config/alacritty/catppuccin-latte.toml"
  #~/.config/alacritty/catppuccin-frappe.toml"
  #"~/.config/alacritty/catppuccin-macchiato.toml"
  # "~/.config/alacritty/catppuccin-mocha.toml"
  #"~/.config/alacritty/dark-pastels.toml"
  #"~/.config/alacritty/cobalt2-default.toml"
  #"~/.config/alacritty/tokyo-night-default.toml"
  #"~/.config/alacritty/deus-default.toml"
  #"~/.config/alacritty/night-owl-dark.toml"
  "~/.config/alacritty/gotham-default.toml"
]

[window]
decorations = "full"
#opacity = 0.95
#blur = true
option_as_alt = "Both"

[font]
normal = { family = "IosevkaTerm Nerd Font", style = "Regular" }
bold = { family = "IosevkaTerm Nerd Font", style = "Bold"}
italic = { family = "IosevkaTerm Nerd Font", style = "Italic"}
bold_italic = { family = "IosevkaTerm Nerd Font", style = "Bold Italic"}
size = 16

[keyboard]
bindings = [
  { key = "Right", mods = "Alt", chars = "\u001BF" },
  { key = "Left", mods = "Alt", chars = "\u001BB" },
  { key = "X", mods = "Alt", chars = "\u001Bx"},
]
